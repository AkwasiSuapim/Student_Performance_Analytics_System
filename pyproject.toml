[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-performance-analytics-system"
version = "0.1.0"
description = "A Python OOP system for student-performance statistics, risk analysis, reporting, visualization, and prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scikit-learn>=1.4,<2",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "python-multipart>=0.0.9",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27,<1",
  "ruff>=0.4",
]

[project.scripts]
student-analytics = "student_performance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"student_performance.data" = ["*.json"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
