[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-performance-analytics-system"
version = "0.1.0"
description = "A Python OOP system for student-performance statistics, risk analysis, reporting, visualization, and prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
student-analytics = "student_performance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

